services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
    mem_limit: 1200m
    volumes:
      - kafka_data:/var/lib/kafka/data

  mlflow:
    image: fraud-jobs:phase8
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    mem_limit: 768m

  api:
    image: fraud-api:phase8
    command: ["python", "-m", "uvicorn", "src.serving.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      FRAUD_SERVING_DB_PATH: /runtime/serving.db
      FRAUD_MODEL_SOURCE: local
      KAFKA_BOOTSTRAP_DOCKER: kafka:29092
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - serving_runtime:/runtime
    depends_on:
      - kafka
      - mlflow
    mem_limit: 768m

  consumer:
    image: fraud-api:phase8
    command: ["python", "-m", "src.serving.consumer", "--docker", "--database", "/runtime/serving.db"]
    environment:
      FRAUD_SERVING_DB_PATH: /runtime/serving.db
      FRAUD_MODEL_SOURCE: local
      KAFKA_BOOTSTRAP_DOCKER: kafka:29092
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - serving_runtime:/runtime
    depends_on:
      - kafka
      - mlflow
      - api
    restart: unless-stopped
    mem_limit: 640m

  dashboard:
    image: fraud-dashboard:phase8
    ports:
      - "8501:8501"
    environment:
      FRAUD_API_URL: http://api:8000
    depends_on:
      - api
    mem_limit: 384m

volumes:
  kafka_data:
  mlflow_data:
  serving_runtime:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: fraud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: dashboard
          image: fraud-dashboard:phase8
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: fraud-settings
          ports:
            - name: http
              containerPort: 8501
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: fraud
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30851

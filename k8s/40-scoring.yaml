apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring
  namespace: fraud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scoring
  template:
    metadata:
      labels:
        app: scoring
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: fraud-api:phase8
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn"]
          args: ["src.serving.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: fraud-settings
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 640Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            - name: serving-runtime
              mountPath: /runtime
        - name: consumer
          image: fraud-api:phase8
          imagePullPolicy: Never
          command: ["python", "-m", "src.serving.consumer"]
          args: ["--docker", "--database", "/runtime/serving.db"]
          envFrom:
            - configMapRef:
                name: fraud-settings
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 350m
              memory: 640Mi
          volumeMounts:
            - name: serving-runtime
              mountPath: /runtime
      volumes:
        - name: serving-runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scoring
  namespace: fraud
spec:
  selector:
    app: scoring
  ports:
    - name: http
      port: 8000
      targetPort: 8000
